[build-system]
requires = ["setuptools>=69", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dynpy"                 
dynamic = ["version"]           
description = "DynPy is a Python module designed for engineering calculations on dynamical systems. It provides a comprehensive framework for modeling, simulating, and analyzing dynamic mechanical systems."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Bogumil Chilinski", email = "example@gmail.com" }]

dependencies = [
  "numpy>=1.26.0",
  "pylatex>=1.4.2",
  "sympy>=1.12",
  "pandas>=2.1.0",
  "matplotlib>=3.8.0",
  "scipy>=1.11.0",
  "pint>=0.23",
  "pypandoc>=1.12",
  "wand>=0.6.11",
]

[project.urls]
Homepage   = "https://github.com/bogumilchilinski/dynpy"
Repository = "https://github.com/bogumilchilinski/dynpy"
Issues     = "https://github.com/bogumilchilinski/dynpy/issues"

[tool.setuptools]
package-dir = { dynpy = "." }
packages = [
  "dynpy",
  "dynpy.management",
  "dynpy.models",
  "dynpy.models.control",
  "dynpy.models.electric",
  "dynpy.models.mechanics",
  "dynpy.models.odes",
  "dynpy.models.thermal",
  "dynpy.solvers",
  "dynpy.utilities",
  "dynpy.utilities.components",
  "dynpy.utilities.components.generic",
  "dynpy.utilities.components.guides",
  "dynpy.utilities.components.guides.development",
  "dynpy.utilities.components.guides.github",
  "dynpy.utilities.components.guides.pandas",
  "dynpy.utilities.components.guides.reporting",
  "dynpy.utilities.components.guides.systems",
  "dynpy.utilities.components.mech",
  "dynpy.utilities.components.miscellaneous",
  "dynpy.utilities.components.ode",
  "dynpy.utilities.documents",
  "dynpy.utilities.templates",
]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme   = "node-and-date"
tag_regex = '^(?:v)?(?P<version>\d+\.\d+\.\d+)$'
fallback_version = "0.0.0"        
